<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>오류 신고 조회 · Trip ON</title>
    <style>
      :root { color-scheme: light; font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17212b; background: #f3f6f8; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 480px); padding: 32px; border: 1px solid #e1e8ed; border-radius: 24px; background: #fff; box-shadow: 0 18px 60px #12304412; }
      .brand { color: #0b8b78; font-size: 13px; font-weight: 800; letter-spacing: .12em; }
      h1 { margin: 28px 0 8px; font-size: 25px; letter-spacing: -.04em; }
      .muted { color: #71808c; line-height: 1.65; }
      .status { display: flex; align-items: center; gap: 12px; margin: 28px 0 12px; padding: 18px; border-radius: 16px; background: #f0f8f6; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #f0a538; box-shadow: 0 0 0 5px #f0a53820; }
      .dot.done { background: #19a57f; box-shadow: 0 0 0 5px #19a57f20; }
      .dot.closed { background: #87939d; box-shadow: 0 0 0 5px #87939d20; }
      #status { font-size: 17px; font-weight: 750; }
      .meta { margin-top: 18px; padding-top: 18px; border-top: 1px solid #edf0f2; font-size: 13px; color: #71808c; }
      #message { min-height: 25px; }
      a { color: #087f72; font-weight: 650; text-decoration: none; }
      @media (max-width: 520px) { main { padding: 26px 22px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">TRIP ON</div>
      <h1 id="title">오류 신고 처리 상태</h1>
      <p class="muted" id="message">신고 내용을 확인하고 있어요.</p>
      <section class="status" aria-live="polite">
        <span id="dot" class="dot"></span>
        <span id="status">불러오는 중</span>
      </section>
      <div class="meta" id="created"></div>
      <p class="meta"><a href="https://trip-on-app.github.io/">Trip ON으로 돌아가기</a></p>
    </main>
    <script>
      (() => {
        const match = location.pathname.match(/^\/error-report\/id=([0-9a-f-]{36})$/i);
        const statusEl = document.getElementById('status');
        const messageEl = document.getElementById('message');
        const createdEl = document.getElementById('created');
        const dotEl = document.getElementById('dot');
        if (!match) {
          statusEl.textContent = '조회할 수 없어요';
          messageEl.textContent = '주소의 신고 번호를 확인해 주세요.';
          return;
        }
        fetch('https://trip-on-api.trip-on-official-dev.workers.dev/v1/error-reports/' + encodeURIComponent(match[1]), { cache: 'no-store' })
          .then(async response => {
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.report) throw new Error('not-found');
            return payload.report;
          })
          .then(report => {
            const labels = { new: '접수됨', reviewing: '검토 중', resolved: '조치 완료', closed: '종료' };
            const state = labels[report.status] ? report.status : 'new';
            statusEl.textContent = labels[state];
            dotEl.classList.toggle('done', state === 'resolved');
            dotEl.classList.toggle('closed', state === 'closed');
            messageEl.textContent = state === 'resolved'
              ? '오류 신고 처리가 완료되었어요.'
              : state === 'closed'
                ? '오류 신고 처리가 종료되었어요.'
                : '접수한 오류 신고를 확인하고 있어요.';
            const date = new Date(report.createdAt);
            if (!Number.isNaN(date.valueOf())) {
              createdEl.textContent = '접수 시각 · ' + new Intl.DateTimeFormat('ko-KR', { dateStyle: 'long', timeStyle: 'short' }).format(date);
            }
          })
          .catch(() => {
            statusEl.textContent = '신고를 찾을 수 없어요';
            messageEl.textContent = '신고 번호가 올바른지 확인하거나 잠시 후 다시 시도해 주세요.';
          });
      })();
    </script>
  </body>
</html>
