<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f2ec" />
    <title>오류 신고 · Trip ON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        font-family: B612, ui-sans-serif, system-ui, sans-serif;
        color: #342d3b;
        background: #f7f2ec;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; }
      a { color: #387c99; text-decoration-thickness: 1px; text-underline-offset: 3px; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 72px;
        padding: 0 clamp(22px, 5vw, 72px);
        border-bottom: 1px solid #e6ddd2;
      }
      .brand { color: #342d3b; font-size: 18px; font-weight: 700; letter-spacing: -.04em; text-decoration: none; }
      nav { display: flex; gap: 22px; font-size: 13px; }
      nav a { color: #6f6877; text-decoration: none; }
      main { width: min(100% - 44px, 720px); margin: 76px auto 96px; }
      .eyebrow { margin: 0 0 18px; color: #777080; font-size: 12px; font-weight: 700; letter-spacing: .14em; }
      h1 { margin: 0; font-size: clamp(38px, 8vw, 68px); line-height: 1.08; letter-spacing: -.065em; }
      .intro { max-width: 570px; margin: 22px 0 0; color: #6f6877; font-size: 16px; line-height: 1.8; }
      .status-line { display: flex; align-items: center; gap: 14px; margin: 44px 0 56px; padding: 18px 0; border-top: 1px solid #e6ddd2; border-bottom: 1px solid #e6ddd2; }
      .status-mark { display: grid; width: 38px; height: 38px; place-items: center; flex: 0 0 38px; background: #bdd5e5; color: #342d3b; font-size: 18px; }
      .status-mark.done { background: #b8e3d5; }
      .status-mark.closed { background: #e4dfe7; }
      #status { font-size: 18px; font-weight: 700; }
      .section-title { margin: 0 0 14px; font-size: 18px; }
      dl { margin: 0; border-top: 1px solid #e6ddd2; }
      dl div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; padding: 17px 0; border-bottom: 1px solid #e6ddd2; }
      dt { color: #777080; font-size: 14px; }
      dd { margin: 0; overflow-wrap: anywhere; font-size: 14px; }
      footer { padding: 22px clamp(22px, 5vw, 72px); border-top: 1px solid #e6ddd2; color: #777080; font-size: 12px; }
      @media (max-width: 520px) {
        header { min-height: 64px; }
        nav { gap: 14px; }
        main { margin-top: 54px; }
        .status-line { margin: 34px 0 44px; }
        dl div { grid-template-columns: 105px minmax(0, 1fr); gap: 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="https://trip-on-app.github.io/">Trip ON</a>
      <nav aria-label="주요 메뉴">
        <a href="https://trip-on-app.github.io/">Trip ON 홈</a>
        <a href="#report-info">신고 내역</a>
      </nav>
    </header>
    <main>
      <p class="eyebrow">ERROR REPORT · TRIP ON</p>
      <h1 id="title">신고 상태를 확인하고 있어요.</h1>
      <p class="intro" id="message">잠시만 기다려 주세요. 접수한 오류 신고의 처리 상태를 불러오고 있어요.</p>
      <section class="status-line" aria-live="polite">
        <span id="mark" class="status-mark" aria-hidden="true">…</span>
        <span id="status">불러오는 중</span>
      </section>
      <h2 id="report-info" class="section-title">신고 내역</h2>
      <dl>
        <div><dt>신고 ID</dt><dd id="reportId">—</dd></div>
        <div><dt>접수 시각</dt><dd id="created">—</dd></div>
      </dl>
    </main>
    <footer>Trip ON 오류 신고 상태 페이지</footer>
    <script>
      (() => {
        const match = location.pathname.match(/^\/error-report\/id=([0-9a-f-]{36})$/i);
        const title = document.getElementById('title');
        const statusEl = document.getElementById('status');
        const messageEl = document.getElementById('message');
        const reportIdEl = document.getElementById('reportId');
        const createdEl = document.getElementById('created');
        const markEl = document.getElementById('mark');
        const notFound = () => {
          title.textContent = '신고를 찾을 수 없어요.';
          statusEl.textContent = '조회할 수 없음';
          messageEl.textContent = '신고 링크가 올바른지 확인한 뒤 다시 열어 주세요.';
          markEl.textContent = '!';
        };
        if (!match) {
          notFound();
          return;
        }
        reportIdEl.textContent = match[1];
        fetch('https://trip-on-api.trip-on-official-dev.workers.dev/v1/error-reports/' + encodeURIComponent(match[1]), { cache: 'no-store' })
          .then(async response => {
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.report) throw new Error('not-found');
            return payload.report;
          })
          .then(report => {
            const states = {
              new: { label: '접수됨', title: '신고가 접수됐어요.', message: '오류 신고가 접수됐어요. 처리 상태가 바뀌면 이 페이지에서 확인할 수 있어요.', mark: '·' },
              reviewing: { label: '검토 중', title: '신고를 확인하고 있어요.', message: '담당자가 오류 내용을 확인하고 있어요. 처리 상태는 이 페이지에서 다시 확인할 수 있어요.', mark: '…' },
              resolved: { label: '조치 완료', title: '신고 처리가 완료됐어요.', message: '오류 신고 처리가 완료됐어요. 알려 주셔서 감사합니다.', mark: '✓', className: 'done' },
              closed: { label: '종료', title: '신고 처리가 종료됐어요.', message: '이 오류 신고의 처리가 종료됐어요.', mark: '—', className: 'closed' }
            };
            const state = states[report.status] || states.new;
            title.textContent = state.title;
            statusEl.textContent = state.label;
            messageEl.textContent = state.message;
            markEl.textContent = state.mark;
            if (state.className) markEl.classList.add(state.className);
            const date = new Date(report.createdAt);
            if (!Number.isNaN(date.valueOf())) {
              createdEl.textContent = new Intl.DateTimeFormat('ko-KR', { dateStyle: 'long', timeStyle: 'short' }).format(date);
            }
          })
          .catch(notFound);
      })();
    </script>
  </body>
</html>
