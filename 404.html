<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f9fd" />
    <title>오류 신고 상태 · Trip ON</title>
    <link rel="icon" type="image/png" href="/assets/trip-on-logo-current.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme:light; --ink:#14243b; --muted:#64738a; --blue:#2155d9; --line:#e4eaf2; --paper:#f7f9fd; --white:#fff; font-family:"Noto Sans KR","DM Sans",sans-serif; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); }
      a { color:inherit; text-decoration:none; }
      .wrap { width:min(100% - 48px,1040px); margin:0 auto; }
      header { height:82px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
      .brand { display:inline-flex; align-items:center; gap:11px; font:800 18px Manrope,sans-serif; letter-spacing:-.06em; }
      .brand img { width:42px; height:42px; object-fit:cover; border-radius:13px; box-shadow:0 5px 15px #162e5517; }
      nav { display:flex; gap:22px; color:#52627a; font-size:13px; font-weight:600; }
      nav a:hover { color:var(--blue); }
      main { width:min(100% - 48px,720px); margin:84px auto 110px; }
      .eyebrow { color:var(--blue); font:700 10px "DM Sans",sans-serif; letter-spacing:.16em; }
      h1 { margin:15px 0; font-size:clamp(36px,7vw,58px); line-height:1.2; letter-spacing:-.07em; }
      .lead { max-width:610px; color:var(--muted); font-size:14px; line-height:1.9; word-break:keep-all; }
      .status { display:flex; align-items:center; gap:14px; margin:34px 0; padding:19px 0; border-block:1px solid var(--line); }
      .mark { width:38px; height:38px; display:grid; place-items:center; flex:none; border-radius:50%; background:#edf3ff; color:var(--blue); font-size:18px; }
      #status { font-size:16px; font-weight:700; }
      .report-id { padding:20px 22px; border:1px solid var(--line); border-radius:16px; background:var(--white); color:var(--muted); font-size:12px; line-height:1.9; }
      .report-id code { display:block; color:var(--ink); font:600 12px "DM Sans",sans-serif; overflow-wrap:anywhere; }
      footer { padding:24px 0; border-top:1px solid var(--line); background:var(--white); color:#8995a7; font-size:11px; }
      .footer-row { display:flex; justify-content:space-between; gap:14px; }
      .footer-links { display:flex; gap:18px; color:#52627a; font-weight:600; }
      @media (max-width:760px) { .wrap { width:min(100% - 36px,560px); } header { height:70px; } .brand img { width:38px; height:38px; } nav { gap:12px; font-size:11px; } main { margin:62px auto 82px; } .footer-row { flex-direction:column; } }
    </style>
  </head>
  <body>
    <header class="wrap">
      <a class="brand" href="/" aria-label="Trip ON 홈"><img src="/assets/trip-on-logo-current.png" alt="" /><span>Trip ON</span></a>
      <nav aria-label="주요 메뉴"><a href="/faq/">자주 묻는 질문</a><a href="/error-report/">오류 신고 안내</a></nav>
    </header>
    <main>
      <p class="eyebrow">ERROR REPORT · TRIP ON</p>
      <h1 id="title">신고 상태를 확인하고 있어요.</h1>
      <p class="lead" id="message">잠시만 기다려 주세요. 접수한 오류 신고의 처리 상태를 불러오고 있어요.</p>
      <section class="status" aria-live="polite"><span id="mark" class="mark" aria-hidden="true">…</span><span id="status">불러오는 중</span></section>
      <div class="report-id"><span>신고 ID</span><code id="reportId">—</code><span>접수 시각</span> <strong id="created">—</strong></div>
    </main>
    <footer><div class="wrap footer-row"><span>© 2026 Trip ON. 여행의 순간을 한곳에.</span><div class="footer-links"><a href="/">소개 페이지</a><a href="/faq/">자주 묻는 질문</a></div></div></footer>
    <script>
      (() => {
        const match = location.pathname.match(/^\/error-report\/id=([0-9a-f-]{36})\/?$/i);
        const title = document.getElementById("title");
        const statusEl = document.getElementById("status");
        const messageEl = document.getElementById("message");
        const markEl = document.getElementById("mark");
        const idEl = document.getElementById("reportId");
        const createdEl = document.getElementById("created");
        const showNotFound = () => {
          title.textContent = "신고를 찾을 수 없어요.";
          statusEl.textContent = "조회할 수 없음";
          messageEl.textContent = "신고 링크가 올바른지 확인한 뒤 다시 열어 주세요.";
          markEl.textContent = "!";
        };
        if (!match) { showNotFound(); return; }
        idEl.textContent = match[1];
        fetch(`https://trip-on-api.trip-on-official-dev.workers.dev/v1/error-reports/${encodeURIComponent(match[1])}`, { cache: "no-store" })
          .then(async (response) => {
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.report) throw new Error("REPORT_NOT_FOUND");
            return payload.report;
          })
          .then((report) => {
            const states = {
              new: { label:"접수됨", title:"신고가 접수됐어요.", message:"오류 신고가 접수됐어요. 처리 상태가 바뀌면 이 페이지에서 확인할 수 있어요.", mark:"·" },
              reviewing: { label:"검토 중", title:"신고를 확인하고 있어요.", message:"담당자가 오류 내용을 확인하고 있어요. 처리 상태는 이 페이지에서 다시 확인할 수 있어요.", mark:"…" },
              resolved: { label:"조치 완료", title:"신고 처리가 완료됐어요.", message:"오류 신고 처리가 완료됐어요. 알려 주셔서 감사합니다.", mark:"✓", done:true },
              closed: { label:"종료", title:"신고 처리가 종료됐어요.", message:"이 오류 신고의 처리가 종료됐어요.", mark:"—", done:true }
            };
            const state = states[report.status] || states.new;
            title.textContent = state.title;
            statusEl.textContent = state.label;
            messageEl.textContent = state.message;
            markEl.textContent = state.mark;
            if (state.done) markEl.style.background = "#b8e3d5";
            const date = new Date(report.createdAt);
            if (!Number.isNaN(date.valueOf())) createdEl.textContent = new Intl.DateTimeFormat("ko-KR", { dateStyle:"long", timeStyle:"short" }).format(date);
          })
          .catch(showNotFound);
      })();
    </script>
  </body>
</html>
